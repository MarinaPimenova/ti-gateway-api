server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0 # Binds to all network interfaces so Docker bridge can connect
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour
  compression:
    enabled: true
    min-response-size: 1024

app:
  authorization-request-timeout: 10 # min
  application-url: "${APPLICATION_URL:http://localhost:8080}"
  logout-url: "${LOGOUT_URL:http://localhost:8080/logout}"

info:
  app:
    name: app
    version: '1.1.1'

spring:
  application:
    name: ${info.app.name:app}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      resolve-lazily: false
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

okta:
  logout-url: https://auth.example.com/v2/logout?client_id=dummy-id&returnTo=http://localhost:5000/dashboard-page/relogin

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    prometheus:
      access: read_only

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

rate:
  limiting:
    enabled: ${LP_RATE_LIMITING_ENABLED:true}
    capacity: ${LP_RATE_LIMITING_CAPACITY:100}
    refill: ${LP_RATE_LIMITING_REFILL:100}
    refill-period: ${LP_RATE_LIMITING_PERIOD:1m}   # minutes
    exclude:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**

ms:
  cors:
    allowed-origins: ${ms.services.dashboard-base-url}
  origin: ${APPLICATION_URL:http://localhost:8080}
  services:
    dashboard-base-url: "${KNOWLEDGE_BASE_URL:http://localhost:5000}"
  client-to-url:
    knowledge-url: "${KNOWLEDGE_BASE_URL:http://localhost:5000}/dashboard-page"
  service-name-to-uri:
    knowledge: http://${KNOWLEDGE_SERVICE:localhost}:${KNOWLEDGE_SERVICE_PORT:8081}
    orchestrator: http://${ORCHESTRATOR_SERVICE:localhost}:${ORCHESTRATOR_SERVICE_PORT:8082}
    import: http://${IMPORT_SERVICE:localhost}:${IMPORT_SERVICE_PORT:8083}
    export: http://${EXPORT_SERVICE:localhost}:${EXPORT_SERVICE_PORT:8084}


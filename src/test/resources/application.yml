server:
  port: 9000
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour
  compression:
    enabled: true
    min-response-size: 1024

app:
  authorization-request-timeout: 10 # min
  application-url: "${APPLICATION_URL:http://localhost:8080}"
  logout-url: "${LOGOUT_URL:http://localhost:8080/logout}"

info:
  app:
    name: ti-gateway-api
    version: '@project.version@'

spring:

  application:
    name: ${info.app.name}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      resolve-lazily: false
      enabled: true
data:
  redis:
    host: localhost
    port: 6379
  security:
    oauth2:
      client:
        registration:
          gateway-client:
            client-id: dummy-id
            client-secret: dummy-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          gateway-client:
            issuer-uri: https://auth.example.com

  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session
  # spring.mvc.pathmatch.matching-strategy=ant_path_matcher
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

okta:
  logout-url: https://domain.com/v2/logout?client_id=123&returnTo=${ms.client-to-url.knowledge-url}/relogin

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true # Enables exemplars for correlation in Grafana
  tracing:
    brave:
      enabled: false # Ensures OpenTelemetry OTEL bridge is favored over Brave

    sampling:
      probability: 1.0 # 100% sampling for local development / troubleshooting
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http


logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.wk.ti: debug
    org.springframework: info

rate:
  limiting:
    enabled: ${LP_RATE_LIMITING_ENABLED:true}
    capacity: ${LP_RATE_LIMITING_CAPACITY:100}
    refill: ${LP_RATE_LIMITING_REFILL:100}
    refill-period: ${LP_RATE_LIMITING_PERIOD:1m}   # minutes
    exclude:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**

ms:
  cors:
    allowed-origins: ${ms.services.dashboard-base-url}
  origin: ${APPLICATION_URL:http://localhost:8080}
  services:
    dashboard-base-url: "${KNOWLEDGE_BASE_URL:http://localhost:5000}"
  client-to-url:
    knowledge-url: "${KNOWLEDGE_BASE_URL:http://localhost:5000}/dashboard-page"
  service-name-to-uri:
    knowledge: http://${KNOWLEDGE_SERVICE:localhost}:${KNOWLEDGE_SERVICE_PORT:8081}
    orchestrator: http://${ORCHESTRATOR_SERVICE:localhost}:${ORCHESTRATOR_SERVICE_PORT:8082}
    import: http://${IMPORT_SERVICE:localhost}:${IMPORT_SERVICE_PORT:8083}
    export: http://${EXPORT_SERVICE:localhost}:${EXPORT_SERVICE_PORT:8084}
    notification: http://${NOTIFICATION_SERVICE:localhost}:${NOTIFICATION_SERVICE_PORT:8085}



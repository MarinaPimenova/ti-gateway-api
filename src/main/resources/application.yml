server:
  port: ${SERVER_PORT:8080}
  # address: 0.0.0.0 # Binds to all network interfaces so Docker bridge can connect
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour
  compression:
    enabled: true
    min-response-size: 1024

app:
  authorization-request-timeout: 10 # min
  application-url: "${APPLICATION_URL:http://localhost:8080}"
  logout-url: "${LOGOUT_URL:http://localhost:8080/logout}"

info:
  app:
    name: ti-gateway-api
    version: '@project.version@'

spring:
  application:
    name: ${info.app.name}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      resolve-lazily: false
      enabled: true
  security:
    oauth2:
      client:
        registration:
          okta:
            provider: okta
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
              - given_name
              - family_name
            client-id: ${OKTA_OAUTH2_CLIENT_ID}
            client-secret: ${OKTA_OAUTH2_CLIENT_SECRET}
            redirect-uri: ${app.application-url}/login/oauth2/code/okta
        provider:
          okta:
            issuer-uri: https://${OKTA_DOMAIN}/
  data:
    redis:
      ssl:
        enabled: ${SESSION_SSL_ENABLED:false}
      host: ${SESSION_CACHE_HOST:127.0.0.1}
      port: ${SESSION_CACHE_PORT:6379}
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session
  # spring.mvc.pathmatch.matching-strategy=ant_path_matcher
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

okta:
  logout-url: https://${OKTA_DOMAIN}/v2/logout?client_id=${OKTA_OAUTH2_CLIENT_ID}&returnTo=${ms.client-to-url.knowledge-url}/relogin

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    prometheus:
      access: read_only

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

rate:
  limiting:
    enabled: ${LP_RATE_LIMITING_ENABLED:true}
    capacity: ${LP_RATE_LIMITING_CAPACITY:100}
    refill: ${LP_RATE_LIMITING_REFILL:100}
    refill-period: ${LP_RATE_LIMITING_PERIOD:1m}   # minutes
    exclude:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**

group:
  admin: ${ADMINS:admin@example.com}

ms:
  cors:
    allowed-origins: ${ms.spa.dashboard-base-url,ms.spa.ai-chatbot-base-url}
  origin: ${APPLICATION_URL:http://localhost:8080}
  spa:
    dashboard-base-url: "${KNOWLEDGE_BASE_URL:http://localhost:5000}"
    ai-chatbot-base-url: "${AI_CHATBOT_BASE_URL:http://localhost:7000}"
  client-to-url:
    knowledge-url: "${KNOWLEDGE_BASE_URL:http://localhost:5000}/dashboard-page"
    ai-chatbot-url: "${AI_CHATBOT_BASE_URL:http://localhost:7000}/chat"
  service-name-to-uri:
    knowledge: http://${KNOWLEDGE_SERVICE:localhost}:${KNOWLEDGE_SERVICE_PORT:8081}
    orchestrator: http://${ORCHESTRATOR_SERVICE:localhost}:${ORCHESTRATOR_SERVICE_PORT:8082}
    import: http://${IMPORT_SERVICE:localhost}:${IMPORT_SERVICE_PORT:8083}
    export: http://${EXPORT_SERVICE:localhost}:${EXPORT_SERVICE_PORT:8084}
    ai-orchestrator: http://${AI_ORCHESTRATOR_SERVICE:localhost}:${AI_ORCHESTRATOR_SERVICE_PORT:8085}
    document: http://${DOCUMENT_SERVICE:localhost}:${DOCUMENT_SERVICE_PORT:8086}
    document-agent: http://${DOCUMENT_AGENT:localhost}:${DOCUMENT_AGENT_PORT:8087}
    sql-agent: http://${SQL_AGENT:localhost}:${SQL_AGENT_PORT:8088}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    urls:
      - name: "01 - Knowledge Service"
        url: "${ms.origin}/knowledge/v3/api-docs"
      - name: "02 - Orchestrator Service"
        url: "${ms.origin}/orchestrator/v3/api-docs"
      - name: "03 - Import Worker"
        url: "${ms.origin}/import/v3/api-docs"
      - name: "04 - Export Service"
        url: "${ms.origin}/export/v3/api-docs"
      - name: "05 - AI Orchestrator Service"
        url: "${ms.origin}/ai-rchestrator/v3/api-docs"
      - name: "06 - AI Document Worker"
        url: "${ms.origin}/document/v3/api-docs"
      - name: "07 - AI Document Agent"
        url: "${ms.origin}/document-agent/v3/api-docs"
      - name: "08 - AI SQL Agent"
        url: "${ms.origin}/sql-agent/v3/api-docs"
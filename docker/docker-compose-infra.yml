services:

  # ============================================================
  # Databases & Middleware
  # ============================================================

  redis:
    container_name: ti-redis
    image: redis:7-alpine
    command: redis-server
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    network_mode: host

  rabbitmq:
    container_name: ti-rabbitmq
    image: rabbitmq:4-management
    hostname: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "15672:15672"
      - "5672:5672"
    network_mode: host

  knowledge-postgres:
    image: postgres:17
    container_name: ti-knowledge-postgres
    environment:
      POSTGRES_DB: ${KNOWLEDGE_DB_NAME:-knowledge_db}
      POSTGRES_USER: ${KNOWLEDGE_USER:-postgres}
      POSTGRES_PASSWORD: ${KNOWLEDGE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./kb-sql:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    network_mode: host

  pgvector-postgres:
    image: ankane/pgvector
    container_name: ti-pgvector-postgres
    environment:
      POSTGRES_DB: ${DOCUMENT_DB_NAME:-document_db}
      POSTGRES_USER: ${DOCUMENT_USER}
      POSTGRES_PASSWORD: ${DOCUMENT_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector-scripts:/docker-entrypoint-initdb.d
    network_mode: host
  # ============================================================
  # Observability
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ti-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    network_mode: host

  loki:
    image: grafana/loki:2.9.5
    container_name: ti-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/tmp/loki
    network_mode: host

  # ------------------------------------------------------------
  # Grafana Alloy - Docker logs -> Loki
  # ------------------------------------------------------------

  alloy:
    image: grafana/alloy:latest
    container_name: ti-grafana-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy

    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Docker container logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Docker metadata
      - /var/run/docker.sock:/var/run/docker.sock:ro

    network_mode: host

  zipkin:
    image: openzipkin/zipkin:3
    container_name: ti-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    network_mode: host

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ti-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASS:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    network_mode: host


# ==============================================================
# Volumes
# ==============================================================

volumes:
  postgres-data:
  pgvector-data:
  redis-data:
  rabbitmq-data:
  loki-data:
  grafana-data:


# ==============================================================
# Networks
# ==============================================================

networks:
  knowledge-network:
    name: knowledge-network
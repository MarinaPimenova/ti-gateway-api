version: '3.8'

services:
  # --- Databases & Middleware ---
  redis-session:
    container_name: redis-session
    image: redis:7-alpine
    command: redis-server
    volumes:
      - redis-data:/data
    network_mode: host

  rabbitmq:
    container_name: ti-rabbitmq-orchestrator
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RM_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RM_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    network_mode: host

  knowledge-postgres:
    image: postgres:17
    container_name: knowledge-postgres
    environment:
      POSTGRES_DB: ${KNOWLEDGE_DB_NAME:-knowledge_db}
      POSTGRES_USER: ${KNOWLEDGE_USER:-postgres}
      POSTGRES_PASSWORD: ${KNOWLEDGE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./kb-sql:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - knowledge-network

  # --- Observability Stack ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    network_mode: host
    volumes:
      - ./observability/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    network_mode: host

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    network_mode: host

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    network_mode: host

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  knowledge-network:
    name: knowledge-network